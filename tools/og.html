<!doctype html>
<!-- The 1200 x 630 social card. `node tools/brand.mjs --png` screenshots this page into og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono-greek-wght-normal.woff2") format("woff2"); font-weight: 100 800; unicode-range: U+0370-03FF; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #08090b; }
  .card { position: relative; width: 1200px; height: 630px; color: #ece8e1; font-family: "Archivo", sans-serif; overflow: hidden; }
  .rules { position: absolute; inset: 0 80px; display: grid; grid-template-columns: repeat(6, 1fr); }
  .rules span { border-left: 1px solid rgba(236, 232, 225, 0.045); }
  .rules span:last-child { border-right: 1px solid rgba(236, 232, 225, 0.045); }
  .haze { position: absolute; right: -60px; top: 40px; width: 720px; height: 620px; background: radial-gradient(closest-side, rgba(255, 75, 38, 0.12), transparent 72%); }
  .og-wordmark { position: absolute; left: 80px; top: 84px; width: 300px; height: auto; }
  h1 { position: absolute; left: 76px; top: 246px; margin: 0; font-size: 92px; line-height: 0.94; font-weight: 500; font-stretch: 112%; letter-spacing: -0.04em; }
  h1 em { font-style: normal; color: #ff4b26; }
  .meta { position: absolute; left: 80px; bottom: 76px; display: flex; gap: 18px; align-items: center; font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #a8a39b; }
  .meta i { width: 40px; height: 1px; background: #ff4b26; }
  .meta b { color: #ece8e1; font-weight: 400; }
  .object { position: absolute; right: 96px; top: 150px; width: 340px; height: 340px; }
  .og-mark { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slit { position: absolute; left: 29%; right: 29%; top: 37.5%; height: 2px; background: #ff4b26; box-shadow: 0 0 18px 6px rgba(255, 75, 38, 0.55), 0 0 60px 20px rgba(255, 75, 38, 0.25); }
</style>
</head>
<body>
<div class="card">
  <div class="rules"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="haze"></div>
  <!--brand:og-wordmark--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 799.25 104" class="og-wordmark" aria-hidden="true" focusable="false"><g fill="#ece8e1"><path transform="translate(0 0)" d="M0 0H13V100H0ZM0 88H70V100H0Z"/><path transform="translate(86 0)" d="M0 100L53.13 -2L106.25 100L91.59 100L53.13 26.14L14.66 100Z"/><path transform="translate(198.25 0)" d="M0 0H84V12H0ZM35.5 12H48.5V100H35.5Z"/><path transform="translate(304.25 0)" d="M0 0H13V100H0ZM73 0H86V100H73ZM13 44H73V56H13Z"/><path transform="translate(420.25 0)" d="M0 0H13V100H0ZM12.99 0H60.99A25 25 0 0 1 85.99 25V33A25 25 0 0 1 60.99 58H12.99V0ZM13 12V46H60.5A12.5 12.5 0 0 0 73 33.5V24.5A12.5 12.5 0 0 0 60.5 12ZM43.22 46L57.88 46L86 100L71.34 100Z"/><path transform="translate(534.25 0)" d="M0 0H13V100H0Z"/><path transform="translate(574.25 0)" d="M38 -1H70A38 38 0 0 1 108 37V63A38 38 0 0 1 70 101H38A38 38 0 0 1 0 63V37A38 38 0 0 1 38 -1ZM38.5 11A25.5 25.5 0 0 0 13 36.5V63.5A25.5 25.5 0 0 0 38.5 89H69.5A25.5 25.5 0 0 0 95 63.5V36.5A25.5 25.5 0 0 0 69.5 11Z"/><path transform="translate(709.25 0)" d="M0 0H13V100H0ZM77 0H90V100H77ZM0 0L15.56 0L90 100L74.44 100Z"/></g></svg><!--/brand:og-wordmark-->
  <h1>Everything,<br>accounted for<em>.</em></h1>
  <div class="meta"><b>Technology holding company</b><i></i><span>lathrion.com</span></div>
  <div class="object">
    <div class="slit"></div>
    <!--brand:og-mark--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="og-mark" aria-hidden="true" focusable="false"><path fill="#ece8e1" d="M50 2L66.15 33L33.85 33Z"/><path fill="#ece8e1" d="M29.17 42L70.83 42L100 98L0 98Z"/></svg><!--/brand:og-mark-->
  </div>
</div>
</body>
</html>
